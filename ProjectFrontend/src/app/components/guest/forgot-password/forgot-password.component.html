<div class="forgot-wrap">
  <div class="forgot-box">
    <a routerLink="/login" class="back">&larr; Back to Login</a>
    <h2>Reset Password</h2>
    <p>Enter your resident email address for password assistance.</p>
    <form (ngSubmit)="send()">
      <div class="field"><label>Email</label><input type="email" [(ngModel)]="email" name="em" required /></div>
      <button type="submit" class="submit-btn">Send Assistance Request</button>
    </form>
  </div>
</div>
