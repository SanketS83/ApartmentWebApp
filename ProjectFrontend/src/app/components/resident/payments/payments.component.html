<div class="card"><h2>Payment History & Receipts</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Txn ID</th><th>Status</th></tr></thead><tbody><tr *ngFor="let p of payments"><td>{{ p.paymentDate }}</td><td>Rs. {{ p.amount }}</td><td>{{ p.paymentMode }}</td><td>{{ p.transactionId }}</td><td>{{ p.status }}</td></tr></tbody></table></div></div>
