<div class="card"><h2>Log Support Ticket</h2><form (ngSubmit)="submit()"><div class="field"><label>Subject</label><input type="text" [(ngModel)]="subject" name="s" required /></div><div class="field"><label>Category</label><select [(ngModel)]="category" name="c"><option value="Plumbing">Plumbing</option><option value="Electrical">Electrical</option><option value="Security">Security</option></select></div><div class="field"><label>Description</label><textarea rows="3" [(ngModel)]="description" name="d" required></textarea></div><button type="submit" class="btn-action">Submit Ticket</button></form></div><div class="card"><h3>Ticket Status</h3><div class="table-wrap"><table><thead><tr><th>Subject</th><th>Status</th><th>Admin Response</th></tr></thead><tbody><tr *ngFor="let c of list"><td>{{ c.subject }}</td><td>{{ c.status }}</td><td>{{ c.adminReply || 'Pending' }}</td></tr></tbody></table></div></div>
