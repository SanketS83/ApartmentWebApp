<div class="card"><h2>Upcoming Events</h2><div *ngFor="let e of events" style="margin-bottom:1rem; border-bottom:1px solid #f1f5f9; padding-bottom:0.75rem;"><h3>{{ e.title }}</h3><p><strong>Date:</strong> {{ e.eventDate }} {{ e.eventTime }} | <strong>Venue:</strong> {{ e.venue }}</p><p>{{ e.description }}</p></div></div>
