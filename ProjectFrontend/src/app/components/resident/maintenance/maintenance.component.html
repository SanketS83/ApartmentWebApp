<div class="card"><h2>My Maintenance Dues</h2><div class="table-wrap"><table><thead><tr><th>Month/Year</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead><tbody><tr *ngFor="let b of bills"><td>{{ b.month }}/{{ b.year }}</td><td>Rs. {{ b.amount }}</td><td>{{ b.dueDate }}</td><td>{{ b.status }}</td></tr></tbody></table></div></div>
