

<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Flat' : 'Add New Flat' }}</h4>

    <div class="alert alert-success" *ngIf="success">{{success}}</div>
    <div class="alert alert-danger" *ngIf="error">{{error}}</div>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="flatNumber" class="form-label">Flat Number</label>
            <input type="text" class="form-control" [(ngModel)]="currentFlat.flatNumber" id="flatNumber" placeholder="e.g. A-101">
        </div>
        <div class="col-md-4 mb-3">
            <label for="building" class="form-label">Building / Tower</label>
            <input type="text" class="form-control" [(ngModel)]="currentFlat.building" id="building" placeholder="e.g. Tower A">
        </div>
        <div class="col-md-4 mb-3">
            <label for="floor" class="form-label">Floor</label>
            <input type="number" class="form-control" [(ngModel)]="currentFlat.floor" id="floor">
        </div>
        <div class="col-md-4 mb-3">
            <label for="flatType" class="form-label">Flat Type</label>
            <select class="form-select" [(ngModel)]="currentFlat.flatType" id="flatType">
                <option value="1 BHK">1 BHK</option>
                <option value="2 BHK">2 BHK</option>
                <option value="3 BHK">3 BHK</option>
                <option value="4 BHK">4 BHK</option>
                <option value="Penthouse">Penthouse</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="area" class="form-label">Area (sq.ft)</label>
            <input type="number" class="form-control" [(ngModel)]="currentFlat.area" id="area">
        </div>
        <div class="col-md-4 mb-3">
            <label for="status" class="form-label">Occupancy Status</label>
            <select class="form-select" [(ngModel)]="currentFlat.status" id="status">
                <option value="Available">Available</option>
                <option value="Occupied">Occupied</option>
                <option value="Under Maintenance">Under Maintenance</option>
            </select>
        </div>

        <div class="col-12 mt-2">
            <button class="btn btn-primary" *ngIf="!isEdit" (click)="saveFlat()">Save</button>
            <button class="btn btn-success" *ngIf="isEdit" (click)="updateFlat()">Update</button>
            <button class="btn btn-secondary ms-2" (click)="resetForm()">Clear</button>
        </div>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered shadow-sm">
  <thead>
    <tr>
        <th>SrNo</th>
        <th>Flat Number</th>
        <th>Building</th>
        <th>Floor</th>
        <th>Type</th>
        <th>Area</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
  </thead>
  <tbody>
     <tr *ngFor="let f of flats; let srNo = index">
        <td>{{srNo+1}}</td>
        <td><strong>{{f.flatNumber}}</strong></td>
        <td>{{f.building}}</td>
        <td>{{f.floor}}</td>
        <td>{{f.flatType}}</td>
        <td>{{f.area}} sqft</td>
        <td><span class="badge" [ngClass]="f.status === 'Occupied' ? 'bg-primary' : (f.status === 'Available' ? 'bg-success' : 'bg-warning')">{{f.status}}</span></td>
        <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editFlat(f)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteFlat(f.id!)">Delete</button>
        </td>
     </tr>
  </tbody>
</table>
</div>
