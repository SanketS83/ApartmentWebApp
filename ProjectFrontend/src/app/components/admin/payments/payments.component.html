

<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Payment Record' : 'Record New Payment' }}</h4>

    <div class="alert alert-success" *ngIf="success">{{success}}</div>
    <div class="alert alert-danger" *ngIf="error">{{error}}</div>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="maintenanceId" class="form-label">Maintenance Invoice ID</label>
            <input type="number" class="form-control" [(ngModel)]="currentPayment.maintenanceId" id="maintenanceId">
        </div>
        <div class="col-md-4 mb-3">
            <label for="transactionId" class="form-label">Transaction ID</label>
            <input type="text" class="form-control" [(ngModel)]="currentPayment.transactionId" id="transactionId" placeholder="e.g. TXN9872134">
        </div>
        <div class="col-md-4 mb-3">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" class="form-control" [(ngModel)]="currentPayment.amount" id="amount">
        </div>
        <div class="col-md-4 mb-3">
            <label for="paymentMode" class="form-label">Payment Mode</label>
            <select class="form-select" [(ngModel)]="currentPayment.paymentMode" id="paymentMode">
                <option value="UPI">UPI / QR Code</option>
                <option value="NetBanking">Net Banking</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Cash">Cash</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="paymentDate" class="form-label">Payment Date</label>
            <input type="date" class="form-control" [(ngModel)]="currentPayment.paymentDate" id="paymentDate">
        </div>
        <div class="col-md-4 mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="currentPayment.status" id="status">
                <option value="Successful">Successful</option>
                <option value="Pending">Pending</option>
                <option value="Failed">Failed</option>
            </select>
        </div>

        <div class="col-12 mt-2">
            <button class="btn btn-primary" *ngIf="!isEdit" (click)="savePayment()">Save</button>
            <button class="btn btn-success" *ngIf="isEdit" (click)="updatePayment()">Update</button>
            <button class="btn btn-secondary ms-2" (click)="resetForm()">Clear</button>
        </div>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered shadow-sm">
  <thead>
    <tr>
        <th>SrNo</th>
        <th>Transaction ID</th>
        <th>Maintenance ID</th>
        <th>Amount</th>
        <th>Method / Mode</th>
        <th>Date</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
  </thead>
  <tbody>
     <tr *ngFor="let p of payments; let srNo = index">
        <td>{{srNo+1}}</td>
        <td><code>{{p.transactionId}}</code></td>
        <td>#{{p.maintenance?.id || p.maintenanceId}}</td>
        <td>₹{{p.amount}}</td>
        <td>{{p.paymentMode}}</td>
        <td>{{p.paymentDate}}</td>
        <td><span class="badge" [ngClass]="p.status === 'Successful' ? 'bg-success' : 'bg-warning'">{{p.status}}</span></td>
        <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editPayment(p)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deletePayment(p.id!)">Delete</button>
        </td>
     </tr>
  </tbody>
</table>
</div>
