<h2>Society Expenses Management</h2>

<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Expense Record' : 'Record New Expense' }}</h4>

    <div class="alert alert-success" *ngIf="success">{{success}}</div>
    <div class="alert alert-danger" *ngIf="error">{{error}}</div>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="title" class="form-label">Expense Title</label>
            <input type="text" class="form-control" [(ngModel)]="currentExpense.title" id="title" placeholder="e.g. Common Area Electricity Bill">
        </div>
        <div class="col-md-4 mb-3">
            <label for="category" class="form-label">Expense Category</label>
            <select class="form-select" [(ngModel)]="currentExpense.category" id="category">
                <option value="Utility">Electricity & Water Utility</option>
                <option value="Maintenance">Maintenance & Repairs</option>
                <option value="Salary">Staff Salaries</option>
                <option value="Security">Security Agency</option>
                <option value="Event">Festivals & Celebrations</option>
                <option value="Administrative">Administrative & Legal</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" class="form-control" [(ngModel)]="currentExpense.amount" id="amount">
        </div>
        <div class="col-md-4 mb-3">
            <label for="expenseDate" class="form-label">Expense Date</label>
            <input type="date" class="form-control" [(ngModel)]="currentExpense.expenseDate" id="expenseDate">
        </div>
        <div class="col-md-8 mb-3">
            <label for="desc" class="form-label">Description / Remarks</label>
            <input type="text" class="form-control" [(ngModel)]="currentExpense.description" id="desc" placeholder="Invoice details, vendor name">
        </div>

        <div class="col-12 mt-2">
            <button class="btn btn-primary" *ngIf="!isEdit" (click)="saveExpense()">Save</button>
            <button class="btn btn-success" *ngIf="isEdit" (click)="updateExpense()">Update</button>
            <button class="btn btn-secondary ms-2" (click)="resetForm()">Clear</button>
        </div>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered shadow-sm">
  <thead>
    <tr>
        <th>SrNo</th>
        <th>Expense Title</th>
        <th>Category</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Description</th>
        <th>Action</th>
    </tr>
  </thead>
  <tbody>
     <tr *ngFor="let ex of expenses; let srNo = index">
        <td>{{srNo+1}}</td>
        <td><strong>{{ex.title}}</strong></td>
        <td><span class="badge bg-secondary">{{ex.category}}</span></td>
        <td>₹{{ex.amount}}</td>
        <td>{{ex.expenseDate}}</td>
        <td>{{ex.description || 'N/A'}}</td>
        <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editExpense(ex)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteExpense(ex.id!)">Delete</button>
        </td>
     </tr>
  </tbody>
</table>
</div>
