

<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Maintenance Invoice' : 'Add New Maintenance Invoice' }}</h4>

    <div class="alert alert-success" *ngIf="success">{{success}}</div>
    <div class="alert alert-danger" *ngIf="error">{{error}}</div>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="flatId" class="form-label">Flat</label>
            <select class="form-select" [(ngModel)]="currentRecord.flatId" id="flatId">
                <option *ngFor="let f of flats" [ngValue]="f.id">{{f.building}} - {{f.flatNumber}}</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="month" class="form-label">Month</label>
            <select class="form-select" [(ngModel)]="currentRecord.month" id="month">
                <option *ngFor="let m of ['January','February','March','April','May','June','July','August','September','October','November','December']" [value]="m">{{m}}</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="year" class="form-label">Year</label>
            <input type="number" class="form-control" [(ngModel)]="currentRecord.year" id="year">
        </div>
        <div class="col-md-4 mb-3">
            <label for="amount" class="form-label">Amount (₹)</label>
            <input type="number" class="form-control" [(ngModel)]="currentRecord.amount" id="amount">
        </div>
        <div class="col-md-4 mb-3">
            <label for="dueDate" class="form-label">Due Date</label>
            <input type="date" class="form-control" [(ngModel)]="currentRecord.dueDate" id="dueDate">
        </div>
        <div class="col-md-4 mb-3">
            <label for="status" class="form-label">Payment Status</label>
            <select class="form-select" [(ngModel)]="currentRecord.status" id="status">
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
                <option value="Overdue">Overdue</option>
            </select>
        </div>

        <div class="col-12 mt-2">
            <button class="btn btn-primary" *ngIf="!isEdit" (click)="saveRecord()">Save</button>
            <button class="btn btn-success" *ngIf="isEdit" (click)="updateRecord()">Update</button>
            <button class="btn btn-secondary ms-2" (click)="resetForm()">Clear</button>
        </div>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered shadow-sm">
  <thead>
    <tr>
        <th>SrNo</th>
        <th>Flat</th>
        <th>Period</th>
        <th>Amount</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
  </thead>
  <tbody>
     <tr *ngFor="let m of records; let srNo = index">
        <td>{{srNo+1}}</td>
        <td><strong>{{m.flat?.building}} - {{m.flat?.flatNumber}}</strong></td>
        <td>{{m.month}} {{m.year}}</td>
        <td>₹{{m.amount}}</td>
        <td>{{m.dueDate}}</td>
        <td><span class="badge" [ngClass]="m.status === 'Paid' ? 'bg-success' : (m.status === 'Overdue' ? 'bg-danger' : 'bg-warning')">{{m.status}}</span></td>
        <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editRecord(m)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteRecord(m.id!)">Delete</button>
        </td>
     </tr>
  </tbody>
</table>
</div>
