<div class="card">
  <h2>Society Overview & Stats</h2>
  <div class="stats">
    <div class="stat-box"><h4>Total Flats</h4><div class="val">{{ flats }}</div></div>
    <div class="stat-box"><h4>Registered Residents</h4><div class="val">{{ residents }}</div></div>
    <div class="stat-box"><h4>Security Guards</h4><div class="val">{{ guards }}</div></div>
    <div class="stat-box"><h4>Open Complaints</h4><div class="val">{{ complaints }}</div></div>
    <div class="stat-box"><h4>Notices Published</h4><div class="val">{{ notices }}</div></div>
  </div>
</div>
