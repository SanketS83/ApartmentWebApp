

<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Resident' : 'Add New Resident' }}</h4>

    <div class="alert alert-success" *ngIf="success">{{success}}</div>
    <div class="alert alert-danger" *ngIf="error">{{error}}</div>

    <div class="row mt-3">
        <div class="col-md-4 mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" [(ngModel)]="currentResident.name" id="name" placeholder="John Doe">
        </div>
        <div class="col-md-4 mb-3">
            <label for="email" class="form-label">Email (Username)</label>
            <input type="email" class="form-control" [(ngModel)]="currentResident.email" id="email" placeholder="john@example.com">
        </div>
        <div class="col-md-4 mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" class="form-control" [(ngModel)]="currentResident.phone" id="phone" placeholder="9876543210">
        </div>
        <div class="col-md-4 mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="text" class="form-control" [(ngModel)]="currentResident.password" id="password" placeholder="Plain text password">
        </div>
        <div class="col-md-4 mb-3">
            <label for="memberType" class="form-label">Member Type</label>
            <select class="form-select" [(ngModel)]="currentResident.memberType" id="memberType">
                <option value="Owner">Owner</option>
                <option value="Tenant">Tenant</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label for="flatId" class="form-label">Allocated Flat</label>
            <select class="form-select" [(ngModel)]="currentResident.flatId" id="flatId">
                <option [ngValue]="null">-- Select Flat (Unallocated) --</option>
                <option *ngFor="let f of flats" 
                        [ngValue]="f.id" 
                        [disabled]="isFlatAllocatedToOther(f.id!)">
                    {{f.building}} - {{f.flatNumber}} ({{f.flatType}}) 
                    {{ isFlatAllocatedToOther(f.id!) ? ' - [Occupied by ' + getFlatOccupantName(f.id!) + ']' : ' - [Available]' }}
                </option>
            </select>
        </div>
        <div class="col-12 mb-3">
            <label for="address" class="form-label">Permanent Address</label>
            <input type="text" class="form-control" [(ngModel)]="currentResident.address" id="address" placeholder="Address details">
        </div>

        <div class="col-12 mt-2">
            <button class="btn btn-primary" *ngIf="!isEdit" (click)="saveResident()">Save</button>
            <button class="btn btn-success" *ngIf="isEdit" (click)="updateResident()">Update</button>
            <button class="btn btn-secondary ms-2" (click)="resetForm()">Clear</button>
        </div>
    </div>
</div>

<div class="table-responsive">
<table class="table table-bordered shadow-sm">
  <thead>
    <tr>
        <th>SrNo</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Type</th>
        <th>Flat</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
  </thead>
  <tbody>
     <tr *ngFor="let r of residents; let srNo = index">
        <td>{{srNo+1}}</td>
        <td><strong>{{r.name}}</strong></td>
        <td>{{r.email}}</td>
        <td>{{r.phone}}</td>
        <td><span class="badge bg-info text-dark">{{r.memberType}}</span></td>
        <td>{{r.flat?.building}} - {{r.flat?.flatNumber}}</td>
        <td><span class="badge bg-success">Active</span></td>
        <td>
            <button class="btn btn-sm btn-warning me-2" (click)="editResident(r)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteResident(r.id!)">Delete</button>
        </td>
     </tr>
  </tbody>
</table>
</div>
