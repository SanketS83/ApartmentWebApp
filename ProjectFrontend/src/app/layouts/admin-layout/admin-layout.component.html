<div class="admin-wrapper">
  <!-- Left Sidebar -->
  <aside class="admin-sidebar text-white bg-dark">
    <div class="sidebar-brand d-flex align-items-center mb-2 pb-2 border-bottom w-100">
      <i class="bi bi-shield-shaded fs-4 text-primary me-2"></i>
      <span class="fs-6 fw-bold">Society Admin</span>
    </div>

    <ul class="nav nav-pills flex-column sidebar-menu">
      <!-- 1. Dashboard -->
      <li class="nav-item">
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
      <!-- 2. Flats -->
      <li class="nav-item">
        <a routerLink="/admin/flats" routerLinkActive="active" class="nav-link">
          <i class="bi bi-buildings me-2"></i> Flats
        </a>
      </li>
      <!-- 3. Residents -->
      <li class="nav-item">
        <a routerLink="/admin/residents" routerLinkActive="active" class="nav-link">
          <i class="bi bi-people me-2"></i> Residents
        </a>
      </li>
      <!-- 4. Guards -->
      <li class="nav-item">
        <a routerLink="/admin/guards" routerLinkActive="active" class="nav-link">
          <i class="bi bi-shield-check me-2"></i> Guards
        </a>
      </li>
      <!-- 5. Maintenance -->
      <li class="nav-item">
        <a routerLink="/admin/maintenance" routerLinkActive="active" class="nav-link">
          <i class="bi bi-tools me-2"></i> Maintenance
        </a>
      </li>
      <!-- 6. Payments -->
      <li class="nav-item">
        <a routerLink="/admin/payments" routerLinkActive="active" class="nav-link">
          <i class="bi bi-credit-card me-2"></i> Payments
        </a>
      </li>
      <!-- 7. Complaints -->
      <li class="nav-item">
        <a routerLink="/admin/complaints" routerLinkActive="active" class="nav-link">
          <i class="bi bi-exclamation-triangle me-2"></i> Complaints
        </a>
      </li>
      <!-- 8. Notices -->
      <li class="nav-item">
        <a routerLink="/admin/notices" routerLinkActive="active" class="nav-link">
          <i class="bi bi-megaphone me-2"></i> Notices
        </a>
      </li>
      <!-- 9. Visitors -->
      <li class="nav-item">
        <a routerLink="/admin/visitors" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-badge me-2"></i> Visitors
        </a>
      </li>
      <!-- 10. Parking -->
      <li class="nav-item">
        <a routerLink="/admin/parking" routerLinkActive="active" class="nav-link">
          <i class="bi bi-p-square me-2"></i> Parking
        </a>
      </li>
      <!-- 11. Events -->
      <li class="nav-item">
        <a routerLink="/admin/events" routerLinkActive="active" class="nav-link">
          <i class="bi bi-calendar-event me-2"></i> Events
        </a>
      </li>
      <!-- 12. Staff -->
      <li class="nav-item">
        <a routerLink="/admin/staff" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-workspace me-2"></i> Staff
        </a>
      </li>
      <!-- 13. Expenses -->
      <li class="nav-item">
        <a routerLink="/admin/expenses" routerLinkActive="active" class="nav-link">
          <i class="bi bi-cash-stack me-2"></i> Expenses
        </a>
      </li>
      <!-- 14. Reports -->
      <li class="nav-item">
        <a routerLink="/admin/reports" routerLinkActive="active" class="nav-link">
          <i class="bi bi-file-earmark-bar-graph me-2"></i> Reports
        </a>
      </li>
      <!-- 15. Admins -->
      <li class="nav-item">
        <a routerLink="/admin/admins" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-gear me-2"></i> Admins
        </a>
      </li>
    </ul>

    <hr class="my-2 border-secondary">
    <div class="sidebar-footer">
      <button class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="admin-main">
    <header class="admin-topbar bg-white border-bottom px-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center text-secondary">
        <i class="bi bi-building me-2 text-primary"></i>
        <span class="fw-semibold">Apartment Society Management System</span>
      </div>
      <div class="d-flex align-items-center">
        <div class="d-flex align-items-center bg-light px-3 py-1 rounded-pill border">
          <i class="bi bi-person-circle fs-5 text-primary me-2"></i>
          <span class="fw-bold text-dark small">Administrator</span>
        </div>
      </div>
    </header>
    <main class="admin-content p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
